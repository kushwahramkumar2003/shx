# Same 9-step gate as `cargo xtask ci` (docs/08-TESTING.md §5).
# clippy -D warnings and typos fail the job; that is the T-002 acceptance.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: cargo xtask ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install gate tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,typos-cli

      - name: cargo xtask ci
        run: cargo xtask ci
