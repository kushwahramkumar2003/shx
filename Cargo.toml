[workspace]
resolver = "3"
members = [
    "crates/shx-core",
    "crates/shx-llm",
    "crates/shx-memory",
    "crates/shx-config",
    "crates/shx-cli",
    "xtask",
    "tools/eval",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Print-only natural-language to shell-command translator"
# Placeholder until the org exists (same <org> convention as CHANGELOG.md);
# release URLs, formula, and manifests derive from it.
repository = "https://github.com/<org>/shx"
# Requested by `dist init` for the Homebrew formula; same placeholder.
homepage = "https://github.com/<org>/shx"

[workspace.dependencies]
# Inward-only graph (ADR-011): core has no shx-* deps; everyone else depends inward.
# Versions are required so cargo-deny does not treat path deps as wildcards.
shx-core = { path = "crates/shx-core", version = "0.0.0" }
shx-llm = { path = "crates/shx-llm", version = "0.0.0" }
shx-memory = { path = "crates/shx-memory", version = "0.0.0" }
shx-config = { path = "crates/shx-config", version = "0.0.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
assert_cmd = "2.0"
# Sync HTTP, rustls only (ADR-006). No OpenSSL, no tokio, no reqwest.
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
