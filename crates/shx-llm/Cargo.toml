# shx-llm: model backends. Depends inward on shx-core only.
# No tokio / reqwest (ADR-006); HTTP, when added, is sync ureq + rustls.
[package]
name = "shx-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LLM backend trait and provider integrations for shx"

[lints]
workspace = true

[[test]]
name = "route_security"
path = "../../tests/route_security.rs"

[[test]]
name = "live"
path = "../../tests/live/harness.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
shx-core.workspace = true
ureq.workspace = true

[dev-dependencies]
serde_json.workspace = true
shx-core.workspace = true
