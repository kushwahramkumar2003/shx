# cargo-deny: licenses, advisories, bans, sources.
# Bans encode ADR-006 (no tokio / reqwest / OpenSSL in this tree).

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# Unused allowances stay until later crates (ureq, rusqlite, clap) land.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "reqwest", reason = "ADR-006: single HTTP stack is ureq" },
    { crate = "tokio", reason = "ADR-006: no async runtime in v1" },
    { crate = "async-std", reason = "ADR-006: no async runtime in v1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
